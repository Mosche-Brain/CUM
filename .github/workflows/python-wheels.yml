name: Build & Publish CumPy Wheels

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: cumpy-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-wheel:
    name: manylinux_2_28_x86_64 wheel
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve oneDNN submodule commit
        id: onednn-sha
        run: |
          echo "sha=$(git rev-parse HEAD:thirdparty/oneDNN)" >> "$GITHUB_OUTPUT"

      - name: Cache static oneDNN (manylinux_2_28)
        id: cache-onednn
        uses: actions/cache@v4
        with:
          path: .cache/onednn-install
          key: onednn-static-manylinux228-oneapi2026-${{ steps.onednn-sha.outputs.sha }}

      - name: Initialize oneDNN submodule (on cache miss)
        if: steps.cache-onednn.outputs.cache-hit != 'true'
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" \
            submodule update --init --depth 1 thirdparty/oneDNN

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: cumpy-ccache-manylinux228-${{ github.sha }}
          restore-keys: |
            cumpy-ccache-manylinux228-

      - name: Build and repair manylinux_2_28 wheel
        run: |
          mkdir -p .cache/onednn-install .cache/ccache dist
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CCACHE_DIR=/ccache \
            -e CUM_ONEDNN_INSTALL_DIR=/onednn \
            -e SRC_DIR=/src \
            -e OUT_DIR=/out \
            -v "$PWD:/src:ro" \
            -v "$PWD/.cache/onednn-install:/onednn" \
            -v "$PWD/.cache/ccache:/ccache" \
            -v "$PWD/dist:/out" \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -euxo pipefail -c '
              trap "chown -R ${HOST_UID}:${HOST_GID} /onednn /ccache /out" EXIT

              dnf install -y gcc-toolset-14 ccache
              /opt/python/cp312-cp312/bin/pip install --no-cache-dir \
                cmake ninja scikit-build-core build

              cat > /etc/yum.repos.d/oneAPI.repo <<REPO
          [oneAPI]
          name=Intel(R) oneAPI repository
          baseurl=https://yum.repos.intel.com/oneapi
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          REPO

              dnf install -y \
                intel-oneapi-compiler-dpcpp-cpp \
                intel-oneapi-mkl-devel \
                intel-oneapi-libdpstd-devel \
                intel-oneapi-tbb-devel

              bash /src/packaging/manylinux/build-wheel.sh
            '

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cumpy-wheels
          path: dist/*.whl
          if-no-files-found: error

  test-wheel:
    name: Test wheel (Python ${{ matrix.python-version }})
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12", "3.13" ]

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: cumpy-wheels
          path: dist

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cumpy wheel + Intel PyPI runtime dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/cumpy-*.whl

      - name: Run cumpy test suite in clean environment
        run: |
          pytest -v "$GITHUB_WORKSPACE/bindings/python/tests"
        working-directory: /tmp

  publish-pypi:
    name: Publish to PyPI
    needs: [ build-wheel, test-wheel ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cumpy
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: cumpy-wheels
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
