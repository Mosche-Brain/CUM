name: Intel oneAPI Multiplatform (icpx + MKL + DPL + DNN)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: cmake-multi-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} - Intel oneAPI
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        build_type: [ Release ]

    steps:
      - name: Free runner disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Resolve oneDNN submodule commit
        id: onednn-sha
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD:thirdparty/oneDNN)" >> "$GITHUB_OUTPUT"

      - name: Cache static oneDNN
        id: cache-onednn
        uses: actions/cache@v4
        with:
          path: .cache/onednn-install
          key: onednn-static-${{ runner.os }}-oneapi2026-${{ steps.onednn-sha.outputs.sha }}

      - name: Initialize oneDNN submodule (on cache miss)
        if: steps.cache-onednn.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" \
            submodule update --init --depth 1 thirdparty/oneDNN

      # ========================================================
      # 1. LINUX SETUP (Ubuntu + GCC 14 + oneAPI APT)
      # ========================================================
      - name: Install toolchain and oneAPI on Linux
        if: runner.os == 'Linux'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 \
            ninja-build \
            libcatch2-dev \
            intel-oneapi-compiler-dpcpp-cpp \
            intel-oneapi-mkl-devel \
            intel-oneapi-onedpl-devel \
            intel-oneapi-tbb-devel
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14

      - name: Initialize Environment (Linux)
        if: runner.os == 'Linux'
        run: |
          source /opt/intel/oneapi/setvars.sh --force || true
          env | grep -E '^(PATH|LD_LIBRARY_PATH|CPATH|LIBRARY_PATH|PKG_CONFIG_PATH|OCL_ICD_FILENAMES|ONEAPI_ROOT|CMPLR_ROOT|MKLROOT|DPL_ROOT|TBBROOT|UMF_ROOT|CMAKE_PREFIX_PATH)=' >> "$GITHUB_ENV"

      # ========================================================
      # 2. WINDOWS SETUP (MSVC + Official oneAPI Installer)
      # ========================================================
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install oneAPI on Windows (Official Installer)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set URL=https://registrationcenter-download.intel.com/akdlm/IRC_NAS/4144bec3-82ce-4672-bd71-5c93a79cd5e7/intel-oneapi-toolkit-2026.1.0.191_offline.exe
          set COMPONENTS=intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mkl.devel:intel.oneapi.win.dpl

          curl.exe --output %TEMP%\webimage.exe --url %URL% --retry 5 --retry-delay 5
          start /b /wait %TEMP%\webimage.exe -s -x -f webimage_extracted --log extract.log
          del %TEMP%\webimage.exe

          webimage_extracted\bootstrapper.exe -s --action install --components=%COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
          set installer_exit_code=%ERRORLEVEL%
          rd /s /q "webimage_extracted"
          exit /b %installer_exit_code%

      - name: Initialize Environment (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, subprocess
          from pathlib import Path

          bat = Path(os.environ["RUNNER_TEMP"]) / "init_oneapi.bat"
          bat.write_text(
              '@call "C:\\Program Files (x86)\\Intel\\oneAPI\\setvars.bat" >nul\r\n@set\r\n',
              encoding="ascii",
          )
          out = subprocess.check_output(["cmd.exe", "/d", "/c", str(bat)], text=True)
          skip_prefixes = ("GITHUB_", "RUNNER_", "ACTIONS_", "PROMPT")
          before = {k.upper(): v for k, v in os.environ.items()}

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as gh_env:
              for line in out.splitlines():
                  if "=" not in line:
                      continue
                  k, v = line.split("=", 1)
                  ku = k.upper()
                  if not k or ku.startswith(skip_prefixes):
                      continue
                  if before.get(ku) != v:
                      gh_env.write(f"{k}={v}\n")

      # ========================================================
      # 3. CMAKE BUILD & TEST
      # ========================================================
      - name: Configure CMake
        shell: bash
        run: |
          ONEDNN_PREFIX="${GITHUB_WORKSPACE//\\//}/.cache/onednn-install"
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_C_COMPILER=icx \
              -DCMAKE_CXX_COMPILER=icx \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_PREFIX_PATH="C:/Program Files (x86)/Intel/oneAPI" \
              -DCUM_ONEDNN_INSTALL_DIR="${ONEDNN_PREFIX}" \
              -S .
          else
            cmake -B build -G Ninja \
              -DCMAKE_C_COMPILER=icx \
              -DCMAKE_CXX_COMPILER=icpx \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_PREFIX_PATH="/opt/intel/oneapi" \
              -DCUM_ONEDNN_INSTALL_DIR="${ONEDNN_PREFIX}" \
              -S .
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
