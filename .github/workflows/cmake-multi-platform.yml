name: Intel oneAPI Multiplatform (icpx + MKL + DPL + DNN)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - Intel oneAPI
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Na Windowsie oneAPI nadal wymaga narzędzi Visual Studio (link.exe / MSVC runtime)
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Oficjalna akcja z repozytorium oneapi-src/oneapi-ci
      - name: Setup Intel oneAPI
        uses: oneapi-src/oneapi-ci@main
        with:
          components: |
            intel-oneapi-compiler-dpcpp-cpp
            intel-oneapi-mkl-devel
            intel-oneapi-dpl
            intel-oneapi-dnnl-devel

      - name: Configure CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_C_COMPILER=icx \
              -DCMAKE_CXX_COMPILER=icx \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S .
          else
            cmake -B build -G Ninja \
              -DCMAKE_C_COMPILER=icx \
              -DCMAKE_CXX_COMPILER=icpx \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S .
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure