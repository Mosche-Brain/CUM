name: Intel oneAPI Multiplatform (icpx + MKL + DPL + DNN)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - Intel oneAPI
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup MSVC dla Windows (musi być przed oneAPI)
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Oficjalna akcja Intela – radzi sobie sama z APT na Ubuntu i instalatorami na Windows
      - name: Install Intel oneAPI Components
        uses: intel/oneapi-setup-action@v1
        with:
          list: |
            intel-oneapi-compiler-dpcpp-cpp
            intel-oneapi-mkl
            intel-oneapi-dnnl
            intel-oneapi-dpl

      - name: Configure CMake
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_C_COMPILER=icx \
              -DCMAKE_CXX_COMPILER=icx \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S .
          else
            cmake -B build -G Ninja \
              -DCMAKE_C_COMPILER=icx \
              -DCMAKE_CXX_COMPILER=icpx \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -S .
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure