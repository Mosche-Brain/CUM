[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "cumpy"
dynamic = ["version"]
description = "CumPy numerical library for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Świadomy Mężczyzna"}
]
dependencies = [
    "dpcpp-cpp-rt>=2026.0,<2027.0",
    "intel-cmplr-lib-rt>=2026.0,<2027.0",
    "intel-opencl-rt>=2026.0,<2027.0",
    "mkl>=2026.0,<2027.0",
    "onemkl-sycl-blas>=2026.0,<2027.0",
    "onemkl-sycl-rng>=2026.0,<2027.0",
    "onemkl-sycl-vm>=2026.0,<2027.0",
    "tbb>=2021.11",
    "umf>=1.0,<2.0",
]

[project.urls]
Homepage = "https://brain.mosche.dev"

[tool.scikit-build]
wheel.packages = ["src/cumpy"]
wheel.exclude = ["include/**", "lib/cmake/**"]
wheel.py-api = "py3"
cmake.build-type = "Release"

# Single source of truth for the version: CUM_VERSION in the top-level CMakeLists.txt.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../CMakeLists.txt"
regex = 'set\(CUM_VERSION "(?P<value>[^"]+)"'
