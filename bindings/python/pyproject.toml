[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "cumpy"
version = "0.1.5.1"
description = "CumPy numerical library for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Świadomy Mężczyzna"}
]
dependencies = []

[project.urls]
Homepage = "https://brain.mosche.dev"

[tool.scikit-build]
wheel.packages = ["src/cumpy"]
wheel.exclude = ["include/**", "lib/cmake/**"]
wheel.py-api = "py3"
cmake.build-type = "Release"
